/* =========================================================================
 * 渲染引擎
 * ========================================================================= */
const WORLD_W = 360, WORLD_H = 180;
function project(lon,lat){ return [lon+180, 90-lat]; }

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);

let view = { scale:1, offsetX:0, offsetY:0 };
let currentYear = 2024;
let filters = { nations:true, routes:true, routesAsia:true, routesEur:true, routesSea:true,
  capitals:true, splits:true, grid:true, labels:true };
let hovered = null;
let selected = null;

function resize() {
  canvas.width  = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width  = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  render();
}
function fitWorld() {
  const w = window.innerWidth, h = window.innerHeight;
  const s = Math.min(w/WORLD_W, h/WORLD_H) * 0.92;
  view.scale = s;
  view.offsetX = (w - WORLD_W*s)/2;
  view.offsetY = (h - WORLD_H*s)/2;
}
function toScreen(lon,lat) {
  const [wx,wy] = project(lon,lat);
  return [wx*view.scale + view.offsetX, wy*view.scale + view.offsetY];
}
function screenToLonLat(sx,sy) {
  return [(sx-view.offsetX)/view.scale - 180, 90 - (sy-view.offsetY)/view.scale];
}

function render() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  // 深海背景
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#04101e');
  grad.addColorStop(0.5,'#082032');
  grad.addColorStop(1,'#04101e');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  if (filters.grid) drawGrid();
  drawLandmasses();
  if (filters.routes) drawRoutes();
  if (filters.capitals) drawCapitalChanges();
  if (filters.splits) drawSplits();
  if (filters.nations) drawNations();
  if (filters.labels) drawLabels();

  updateZoomInfo();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(35,65,95,0.35)';
  ctx.lineWidth = 1;
  for (let lon=-180; lon<=180; lon+=30) {
    const [x1,y1] = toScreen(lon,90);
    const [x2,y2] = toScreen(lon,-90);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  for (let lat=-90; lat<=90; lat+=30) {
    const [x1,y1] = toScreen(-180,lat);
    const [x2,y2] = toScreen(180,lat);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  // 赤道加亮
  ctx.strokeStyle = 'rgba(79,195,247,0.25)';
  ctx.lineWidth = 1.2;
  const [ex1,ey1] = toScreen(-180,0);
  const [ex2,ey2] = toScreen(180,0);
  ctx.beginPath(); ctx.moveTo(ex1,ey1); ctx.lineTo(ex2,ey2); ctx.stroke();
}

function drawLandmasses() {
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  for (const poly of ALL_LANDS) {
    if (!poly || poly.length === 0) continue;

    // 外发光
    ctx.beginPath();
    for (let i=0; i<poly.length; i++) {
      const [x,y] = toScreen(poly[i][0], poly[i][1]);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(50,110,170,0.25)';
    ctx.lineWidth = 6;
    ctx.stroke();

    // 填充
    ctx.fillStyle = '#132741';
    ctx.fill();

    // 清晰边界
    ctx.strokeStyle = '#5fa8d8';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    // 内侧高光
    ctx.strokeStyle = 'rgba(150,210,255,0.4)';
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }
}

function drawRoutes() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const route of ROUTES) {
    if (route.region === 'asia' && !filters.routesAsia) continue;
    if (route.region === 'europe' && !filters.routesEur) continue;
    if (route.region === 'sea' && !filters.routesSea) continue;
    if (currentYear < route.startYear) continue;

    let progress = 1;
    if (currentYear < route.endYear) {
      progress = (currentYear - route.startYear) / (route.endYear - route.startYear);
      progress = Math.max(0.03, Math.min(1, progress));
    }
    const drawn = progress * (route.points.length - 1);

    // 外发光
    ctx.strokeStyle = route.color;
    ctx.globalAlpha = 0.18;
    ctx.lineWidth = 8;
    strokeRoute(route.points, drawn);

    // 主线
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 1.8;
    strokeRoute(route.points, drawn);

    // 途经点
    ctx.globalAlpha = 1;
    for (let i=0; i<route.points.length; i++) {
      if (i > drawn) break;
      const [x,y] = toScreen(route.points[i][0], route.points[i][1]);
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI*2);
      ctx.fillStyle = route.color;
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function strokeRoute(pts, drawn) {
  ctx.beginPath();
  for (let i=0; i<pts.length; i++) {
    const [x,y] = toScreen(pts[i][0], pts[i][1]);
    if (i===0) ctx.moveTo(x,y);
    else if (i<=drawn) ctx.lineTo(x,y);
    else {
      const frac = drawn - (i-1);
      if (frac>0) {
        const [px,py] = toScreen(pts[i-1][0], pts[i-1][1]);
        ctx.lineTo(px+(x-px)*frac, py+(y-py)*frac);
      }
      break;
    }
  }
  ctx.stroke();
}

function drawCapitalChanges() {
  ctx.setLineDash([4,3]);
  ctx.lineWidth = 1.2;

  for (const c of CAPITAL_CHANGES) {
    if (currentYear < c.year) continue;
    const [x1,y1] = toScreen(c.from.lon, c.from.lat);
    const [x2,y2] = toScreen(c.to.lon, c.to.lat);

    ctx.strokeStyle = 'rgba(255,213,79,0.5)';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

    ctx.beginPath(); ctx.arc(x1,y1,3,0,Math.PI*2);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = '#0a1628'; ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x2,y2-4); ctx.lineTo(x2+4,y2);
    ctx.lineTo(x2,y2+4); ctx.lineTo(x2-4,y2);
    ctx.closePath();
    ctx.fillStyle = '#ffd54f'; ctx.fill();
    ctx.strokeStyle = '#0a1628'; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawSplits() {
  const t = (Date.now() % 2000) / 2000;
  for (const s of COUNTRY_SPLITS) {
    if (currentYear < s.year) continue;
    const [x,y] = toScreen(s.lon, s.lat);
    const r = 6 + t*12;
    const a = 1 - t;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle = `rgba(255,23,68,${a*0.7})`;
    ctx.lineWidth = 2; ctx.stroke();

    ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(255,23,68,0.45)';
    ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath(); ctx.arc(x,y,3.2,0,Math.PI*2);
    ctx.fillStyle = '#ff1744'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }
}

function drawNations() {
  for (const n of NATIONS) {
    if (currentYear < n.founded) continue;
    const [x,y] = toScreen(n.lon, n.lat);
    if (x < -30 || x > window.innerWidth+30 || y < -30 || y > window.innerHeight+30) continue;

    const isHover = hovered && hovered.kind==='nation' && hovered.data===n;
    const isSel = selected === n;
    const r = (isHover || isSel) ? 6 : 3.2;

    if (isHover || isSel) {
      ctx.beginPath(); ctx.arc(x,y,r+6,0,Math.PI*2);
      ctx.fillStyle = 'rgba(255,213,79,0.22)'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = (isHover||isSel) ? '#ffd54f' : '#ffb300';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1; ctx.stroke();
  }
}

function drawLabels() {
  if (view.scale < 4) return;
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  ctx.fillStyle = '#fff';

  for (const n of NATIONS) {
    if (currentYear < n.founded) continue;
    const [x,y] = toScreen(n.lon, n.lat);
    if (x < 0 || x > window.innerWidth || y < 0 || y > window.innerHeight) continue;
    ctx.strokeText(n.name, x, y-9);
    ctx.fillText(n.name, x, y-9);
  }
}

/* =========================================================================
 * 交互
 * ========================================================================= */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const ns = Math.max(0.4, Math.min(100, view.scale*factor));
  const r = ns / view.scale;
  view.offsetX = mx - (mx-view.offsetX)*r;
  view.offsetY = my - (my-view.offsetY)*r;
  view.scale = ns;
  render();
}, { passive:false });

function zoomIn() {
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const r = 1.3;
  view.offsetX = cx - (cx-view.offsetX)*r;
  view.offsetY = cy - (cy-view.offsetY)*r;
  view.scale *= r;
  render();
}
function zoomOut() {
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const r = 1/1.3;
  view.offsetX = cx - (cx-view.offsetX)*r;
  view.offsetY = cy - (cy-view.offsetY)*r;
  view.scale *= r;
  render();
}
function resetView() { fitWorld(); render(); }

let isDragging = false, dragMoved = false;
let dragStart = { x:0, y:0, ox:0, oy:0 };

canvas.addEventListener('mousedown', e => {
  isDragging = true; dragMoved = false;
  canvas.classList.add('dragging');
  dragStart = { x:e.clientX, y:e.clientY, ox:view.offsetX, oy:view.offsetY };
});
window.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    view.offsetX = dragStart.ox + dx;
    view.offsetY = dragStart.oy + dy;
    render();
    return;
  }
  handleHover(e);
  updateCoords(e);
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.classList.remove('dragging');
});

function handleHover(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = null;

  if (filters.capitals) {
    for (const c of CAPITAL_CHANGES) {
      if (currentYear < c.year) continue;
      const [x2,y2] = toScreen(c.to.lon, c.to.lat);
      const [x1,y1] = toScreen(c.from.lon, c.from.lat);
      if (Math.hypot(mx-x2,my-y2)<10 || Math.hypot(mx-x1,my-y1)<8) {
        found = { kind:'capital', data:c }; break;
      }
    }
  }
  if (!found && filters.splits) {
    for (const s of COUNTRY_SPLITS) {
      if (currentYear < s.year) continue;
      const [x,y] = toScreen(s.lon,s.lat);
      if (Math.hypot(mx-x,my-y)<12) { found = { kind:'split', data:s }; break; }
    }
  }
  if (!found && filters.nations) {
    for (const n of NATIONS) {
      if (currentYear < n.founded) continue;
      const [x,y] = toScreen(n.lon,n.lat);
      if (Math.hypot(mx-x,my-y)<10) { found = { kind:'nation', data:n }; break; }
    }
  }

  const changed = (found && found.data) !== (hovered && hovered.data);
  hovered = found;
  canvas.style.cursor = found ? 'pointer' : (isDragging ? 'grabbing' : 'grab');
  if (changed) render();
}

canvas.addEventListener('click', e => {
  if (dragMoved) { dragMoved = false; return; }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (filters.nations) {
    for (const n of NATIONS) {
      if (currentYear < n.founded) continue;
      const [x,y] = toScreen(n.lon, n.lat);
      if (Math.hypot(mx-x,my-y)<10) { showInfo(n); return; }
    }
  }
  hideInfo();
});

function showInfo(n) {
  selected = n;
  const panel = document.getElementById('infoPanel');
  const c = document.getElementById('infoContent');
  c.innerHTML = `
    <h2>${n.name}</h2>
    <div class="sub">${n.status} · 建国 ${fmtYear(n.founded)}</div>
    <div class="row"><span class="label">首都</span><span class="value">${n.capital||'—'}</span></div>
    <div class="row"><span class="label">总人口</span><span class="value">${n.population}</span></div>
    <div class="row"><span class="label">使用语言</span><span class="value">${n.language}</span></div>
    <div class="row"><span class="label">发展状态</span><span class="value">${n.status}</span></div>
    <div class="row"><span class="label">坐标</span><span class="value">${n.lon.toFixed(2)}°, ${n.lat.toFixed(2)}°</span></div>
  `;
  panel.style.display = 'block';
  render();
}
function hideInfo() {
  selected = null;
  document.getElementById('infoPanel').style.display = 'none';
  render();
}

const yearSlider = document.getElementById('yearSlider');
const yearLabel = document.getElementById('yearLabel');
yearSlider.addEventListener('input', () => {
  currentYear = parseInt(yearSlider.value);
  yearLabel.textContent = fmtYear(currentYear);
  render();
});
function fmtYear(y) { return y>0 ? y+'年' : '公元前'+(-y)+'年'; }

const bind = (id,key) => {
  const el = document.getElementById(id);
  el.addEventListener('change', () => { filters[key]=el.checked; render(); });
};
bind('fNations','nations');
bind('fRoutes','routes');
bind('fRoutesAsia','routesAsia');
bind('fRoutesEur','routesEur');
bind('fRoutesSea','routesSea');
bind('fCapitals','capitals');
bind('fSplits','splits');
bind('fGrid','grid');
bind('fLabels','labels');

function toggleFilter() {
  document.getElementById('filterBody').classList.toggle('collapsed');
}

function updateCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const [lon,lat] = screenToLonLat(e.clientX-rect.left, e.clientY-rect.top);
  const el = document.getElementById('coords');
  if (lon>=-180 && lon<=180 && lat>=-90 && lat<=90) {
    el.textContent = `${lat>=0?'N':'S'}${Math.abs(lat).toFixed(2)}° ${lon>=0?'E':'W'}${Math.abs(lon).toFixed(2)}°`;
  } else {
    el.textContent = '—';
  }
}
function updateZoomInfo() {
  const kmPerPx = 40075 / (WORLD_W * view.scale * 111);
  document.getElementById('zoomInfo').textContent = `zoom: ${view.scale.toFixed(2)}× · 分辨率: ~${(40075/(WORLD_W*view.scale)).toFixed(0)} km/°`;
}

// 触摸
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length===1) {
    isDragging = true; dragMoved = false;
    dragStart = { x:e.touches[0].clientX, y:e.touches[0].clientY,
      ox:view.offsetX, oy:view.offsetY };
  } else if (e.touches.length===2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive:true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length===1 && isDragging) {
    const dx = e.touches[0].clientX - dragStart.x;
    const dy = e.touches[0].clientY - dragStart.y;
    if (Math.abs(dx)>3 || Math.abs(dy)>3) dragMoved = true;
    view.offsetX = dragStart.ox + dx;
    view.offsetY = dragStart.oy + dy;
    render();
  } else if (e.touches.length===2) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    const r = d / lastTouchDist;
    lastTouchDist = d;
    const cx = (e.touches[0].clientX + e.touches[1].clientX)/2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY)/2;
    view.offsetX = cx - (cx-view.offsetX)*r;
    view.offsetY = cy - (cy-view.offsetY)*r;
    view.scale *= r;
    render();
  }
}, { passive:true });
canvas.addEventListener('touchend', () => { isDragging = false; }, { passive:true });

// 脉冲动画
let lastPulse = 0;
function tick(now) {
  if (now - lastPulse > 60) {
    lastPulse = now;
    if (filters.splits && COUNTRY_SPLITS.some(s => currentYear >= s.year)) render();
  }
  requestAnimationFrame(tick);
}

window.addEventListener('resize', resize);
resize();
fitWorld();
render();
requestAnimationFrame(tick);
</script>
